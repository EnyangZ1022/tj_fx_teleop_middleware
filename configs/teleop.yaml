input:
  source: pico
  expected_input_rate_hz: 95

teleop:
  mode: "position_only"

orientation_tracking:
  enabled: false
  orientation_algorithm: "absolute_matrix"
  use_calibration_offset: true
  relative_mode: "world"
  rotation_scale: 0.4
  max_total_angle_deg: 25.0
  max_step_angle_deg: 2.0
  arm_A:
    controller_side: "left"
    rotvec_mapping:
      matrix:
        - [0.0, 0.0, -1.0]
        - [0.0, -1.0, 0.0]
        - [1.0, 0.0, 0.0]
  arm_B:
    controller_side: "right"
    rotvec_mapping:
      matrix:
        - [0.0, 0.0, 1.0]
        - [0.0, -1.0, 0.0]
        - [1.0, 0.0, 0.0]

orientation_filter:
  enabled: true
  tau_s: 0.02
  fallback_dt_s: 0.01
  reset_on_calibration: true

timing:
  proposed_command_loop_rate_hz: 100
  fallback_command_loop_rate_hz: 50
  note: "Command loop rate should divide the 1000 Hz robot controller internal loop."

mapping:
  enable:
    field: grip
    threshold: 0.8
    mode: hold
  gripper:
    field: trigger
    formula: "1.0 - trigger"
    deadband: 0.01

reserved_buttons:
  primaryButton: start_pause
  secondaryButton: cancel_reset
  axisClick: calibration_request_preferred
  menuButton: unused_in_mvp
  note: "MVP calibration uses axisClick rising edge; menuButton is unused and not safety-critical."

coordinate_transform:
  pico_frame:
    x: user_right
    y: user_up
    z: user_forward
    unit: meter

  user_frame_calibration:
    enabled: true
    default_r_user_from_pico: identity
    note: "Future work may estimate this matrix from user forward/right calibration motions."

  arm_mapping:
    right:
      sdk_frame:
        x: forward
        y: up
        z: right
      axis_matrix_from_user:
        - [0, 0, -1]
        - [0, 1, 0]
        - [1, 0, 0]
      scale: 1.0
    left:
      sdk_frame:
        x: forward
        y: down
        z: left
      axis_matrix_from_user:
        - [0, 0, -1]
        - [0, -1, 0]
        - [-1, 0, 0]
      scale: 1.0

safety_gate:
  pico_timeout_ms: 300.0
  enable:
    on_threshold: 0.85
    off_threshold: 0.65
    note: "Stage 4 currently uses on_threshold for simple hold-to-enable logic; hysteresis can be added later."
  limits:
    max_single_step_mm: 50.0
    max_velocity_mm_s: 500.0
  policy:
    allow_single_arm_motion: true
    require_both_arms_calibrated: false
  note: "Stage 4 gate is pure-Python and only decides whether a target is safe for a future SDK loop."

command_loop:
  rate_hz: 100.0
  fallback_rate_hz: 50.0
  controller_inner_loop_hz: 1000.0
  target_max_age_ms: 300.0

units:
  pico_position: meter
  robot_position: millimeter
  robot_orientation: degree
  joint_angle: degree
  time: second

ik_reference:
  left_deg: [90, -90, -90, -90, 0, 0, 0]
  right_deg: [90, 90, -90, -90, 0, 0, 0]

target_limits:
  max_single_step_mm: 5.0
  max_cartesian_velocity_mm_s: 200.0
  clip_instead_of_reject: true
